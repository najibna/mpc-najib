server:
  port: ${PORT:8010}

spring:
  main:
    banner-mode: "off"
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

app:
  openrouter-api-key: ${OPENROUTER_API_KEY:}
  openrouter-model: ${OPENROUTER_MODEL:google/gemini-2.5-flash}
  openrouter-base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1/chat/completions}
  frontend-origins: ${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5180,http://localhost:5181}
  sample-data-path: classpath:sample_data/dummy_data.xlsx
