services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  backend:
    build: ./backend
    ports:
      - "8010:8010"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/intact
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      FRONTEND_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:5180
      MESSAGING_ENABLED: "true"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      - mongodb
      - rabbitmq

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8010
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
